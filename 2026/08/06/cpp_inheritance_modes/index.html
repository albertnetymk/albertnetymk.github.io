      <h1 class="post-title">
        
          C++ Inheritance Modes
        
      </h1>

      <time class="post-time">
          Aug 6 2026
      </time>
    </header>

    <div class="post-content">
    <p>The inheritance mode sits in the declaration <code>class child : &lt;mode&gt; parent</code>; it controls how the parent’s members are demoted for outsiders.</p>
<figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;iostream&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Base</span> &#123;</span><br><span class="line"><span class="keyword">public</span>:</span><br><span class="line">  <span class="type">int</span> pub = <span class="number">1</span>;</span><br><span class="line"></span><br><span class="line"><span class="keyword">protected</span>:</span><br><span class="line">  <span class="type">int</span> prot = <span class="number">2</span>;</span><br><span class="line"></span><br><span class="line"><span class="keyword">private</span>:</span><br><span class="line">  <span class="type">int</span> priv = <span class="number">3</span>;</span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="comment">// Whether a super-class member is accessible inside child-class or not is solely</span></span><br><span class="line"><span class="comment">// determined by super-class access level. Therefore, the child-class of any</span></span><br><span class="line"><span class="comment">// inheritance mode can access pub and prot.</span></span><br><span class="line"></span><br><span class="line"><span class="comment">// In contrast, the inheritance mode demotes super-class members: the effective</span></span><br><span class="line"><span class="comment">// access is the stricter of the member&#x27;s level and the mode&#x27;s level</span></span><br><span class="line"><span class="comment">// (public &gt; protected &gt; private), applied only to outsiders (external code and</span></span><br><span class="line"><span class="comment">// further derived classes).</span></span><br><span class="line"><span class="comment">//</span></span><br><span class="line"><span class="comment">//   Base member level | PUBLIC inherit | PROTECTED inherit | PRIVATE inherit</span></span><br><span class="line"><span class="comment">//   ------------------+----------------+-------------------+----------------</span></span><br><span class="line"><span class="comment">//   public              public          protected          private</span></span><br><span class="line"><span class="comment">//   protected           protected       protected          private</span></span><br><span class="line"><span class="comment">//   private             private         private            private</span></span><br><span class="line"><span class="comment">//</span></span><br><span class="line"><span class="comment">// 1) PUBLIC: access levels pass through unchanged.</span></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Pub</span> : <span class="keyword">public</span> Base &#123;</span><br><span class="line"><span class="keyword">public</span>:</span><br><span class="line">  <span class="function"><span class="type">void</span> <span class="title">inside</span><span class="params">()</span> </span>&#123;</span><br><span class="line">    std::cout &lt;&lt; pub &lt;&lt; prot; <span class="comment">// OK: pub public, prot protected</span></span><br><span class="line">    <span class="comment">// priv;                    // ERROR: private in Base</span></span><br><span class="line">  &#125;</span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="comment">// 2) PROTECTED: Base&#x27;s public members demoted to protected.</span></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Prot</span> : <span class="keyword">protected</span> Base &#123;</span><br><span class="line"><span class="keyword">public</span>:</span><br><span class="line">  <span class="function"><span class="type">void</span> <span class="title">inside</span><span class="params">()</span> </span>&#123;</span><br><span class="line">    std::cout &lt;&lt; pub &lt;&lt; prot; <span class="comment">// OK: both protected now</span></span><br><span class="line">  &#125;</span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="comment">// 3) PRIVATE: everything collapses to private in Priv.</span></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Priv</span> : <span class="keyword">private</span> Base &#123;</span><br><span class="line"><span class="keyword">public</span>:</span><br><span class="line">  <span class="function"><span class="type">void</span> <span class="title">inside</span><span class="params">()</span> </span>&#123;</span><br><span class="line">    std::cout &lt;&lt; pub &lt;&lt; prot; <span class="comment">// OK: private in Priv, visible here</span></span><br><span class="line">  &#125;</span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span> </span>&#123;</span><br><span class="line">  Pub p;</span><br><span class="line">  (<span class="type">void</span>)p.pub;                   <span class="comment">// OK: public</span></span><br><span class="line">  <span class="comment">// p.prot;                     // ERROR: protected</span></span><br><span class="line"></span><br><span class="line">  Prot t;</span><br><span class="line">  <span class="comment">// t.pub;                      // ERROR: demoted to protected</span></span><br><span class="line"></span><br><span class="line">  Priv v;</span><br><span class="line">  <span class="comment">// v.pub;                      // ERROR: demoted to private</span></span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
